name: AI training planner

on:
  schedule:
    # 2:00 AM Warsaw time (CEST/UTC+2). Runs 1:00 AM Warsaw time during CET/winter (UTC+1) — cron has no DST awareness.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service-account credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Write training strategy
        env:
          STRATEGIA_TXT: ${{ secrets.STRATEGIA_TXT }}
        run: echo "$STRATEGIA_TXT" > strategia.txt

      - name: Run AI planner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python ai_planner.py
