name: Garmin sync + AI training plan

on:
  schedule:
    # 2:00 AM Warsaw time (CEST/UTC+2). Runs 1:00 AM Warsaw time during CET/winter (UTC+1) — cron has no DST awareness.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Garmin session cache
        uses: actions/cache@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service-account credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Decode and unpack strategies
        run: |
          echo "${{ secrets.STRATEGIES_ZIP_B64 }}" | base64 --decode > strategies.zip
          unzip strategies.zip

      - name: Run sync + planner
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
